# ============================================
# Docker Compose Configuration for Shop Template
# Development environment
# ============================================

services:
  # ============================================
  # Web Application
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: shop-template-web
    restart: unless-stopped
    command: web
    volumes:
      - .:/app
      - /app/docker  # Prevent host docker folder from overriding container's /app/docker
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=shop_template.settings.development
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - INTERNAL_IPS=127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shop-template-network
    healthcheck:
      test: ["CMD", "python", "/app/scripts/wait_for_db.py", "--timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Database (PostgreSQL)
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: shop-template-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --data-checksums
    ports:
      - "5432:5432"
    networks:
      - shop-template-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis (Cache & Message Broker)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: shop-template-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - shop-template-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Celery Worker
  # ============================================
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: shop-template-celery
    restart: unless-stopped
    command: celery
    volumes:
      - .:/app
      - /app/docker  # Prevent host docker folder from overriding container's /app/docker
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=shop_template.settings.development
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - web
      - redis
      - db
    networks:
      - shop-template-network

  # ============================================
  # Celery Beat (Periodic Tasks)
  # ============================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: shop-template-celery-beat
    restart: unless-stopped
    command: celery-beat
    volumes:
      - .:/app
      - /app/docker  # Prevent host docker folder from overriding container's /app/docker
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=shop_template.settings.development
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - web
      - redis
      - db
    networks:
      - shop-template-network

  # ============================================
  # Nginx (Reverse Proxy - Optional for development)
  # ============================================
  # nginx:
  #   image: nginx:1.25-alpine
