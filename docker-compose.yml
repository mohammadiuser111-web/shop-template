  #     - "1025:1025"  # SMTP
  #     - "8025:8025"  # Web UI
  #   networks:
  #     - shop-template-network

  # ============================================
  # pgAdmin (Database Admin - Optional)
  # ============================================
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: shop-template-pgadmin
  #   restart: unless-stopped
