{# Responsive image ad template #}
{% if ad.url %}
<a href="{{ ad.url }}" target="{{ ad.target|default:'_blank' }}" 
   onclick="trackAdClick('{{ ad.id }}')" 
   style="display: inline-block; text-decoration: none; width: {{ width }}px; height: {{ height }}px; overflow: hidden;">
{% endif %}
    {% if ad.image %}
    <img src="{{ ad.image.url }}" 
         alt="{{ ad.image_alt|default:ad.name }}" 
         title="{{ ad.title }}"
         style="width: 100%; height: 100%; object-fit: cover; display: block;"
         onerror="this.style.display='none'">
    {% else %}
    <div style="width: 100%; height: 100%; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
        <span style="color: #999; font-size: 12px;">{{ _('تبلیغ') }}</span>
    </div>
    {% endif %}
{% if ad.url %}
</a>
{% endif %}

<script>
function trackAdClick(adId) {
    fetch('/ads/track/click/' + adId + '/', {
        method: 'POST',
        headers: {
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        credentials: 'same-origin'
    }).catch(function(error) {
        console.log('Ad click tracking failed:', error);
    });
}
</script>
