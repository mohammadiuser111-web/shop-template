# ============================================
# Pre-commit Hooks Configuration for Shop Template
# ============================================

repos:
  # Remove trailing whitespace
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: fix-encoding-pragma
        args: [--remove]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        args: [--line-length=120, --skip-string-normalization]
        language_version: python3.11

  # Python imports sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120, --atomic]

  # Python linting
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: [--max-line-length=120, --extend-ignore=E203,W503]

  # Python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --disallow-untyped-defs, --disallow-incomplete-defs]
        exclude: ^(migrations|tests|fixtures)
        additional_dependencies: [django-stubs]

  # Python security
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: [--skip=B101,B303,B307,B403,B404,B608]
        exclude: ^(tests|migrations)

  # Django
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-docstring-first
      - id: debug-statements

  # CSS
  - repo: https://github.com/pre-commit/mirrors-stylelint
    rev: v15.11.0
    hooks:
      - id: stylelint
        types: [css, scss]
        args: [--config=stylelint.config.js]

  # JavaScript
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        types: [javascript, jsx, typescript, tsx]
        args: [--config=.eslintrc.js, --fix]

  # Markdown
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-markdown-img-alt
      - id: check-markdown-links

  # Shell scripts
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # File size
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]

# ============================================
# Settings
# ============================================

# Minimum pre-commit version
minimum_pre_commit_version: 2.17.0

# Auto-update hooks
autoupdate: true

# Default language version
default_language_version:
  python: python3.11

# Files to exclude from pre-commit
exclude: |
  (?x)^(
    .*\.min\.(js|css)$|
    .*\.bundle\.(js|css)$|
    node_modules/|
    venv/|
    .venv/|
    ENV/|
    env/|
    migrations/|
    __pycache__/|
    static/CACHE/|
    .git/|
    .idea/|
    .vscode/|
    *.sqlite3$
  )

# ============================================
# Arguments for pre-commit run
# ============================================

# Run on all files
# pre-commit run --all-files

# Skip specific hooks
# SKIP=black,flake8,isort

# Run specific hooks only
# pre-commit run black --all-files

# Bypass pre-commit (not recommended)
# git commit --no-verify
